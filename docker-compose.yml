name: hiremind

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hiremind
      POSTGRES_USER: hiremind
      POSTGRES_PASSWORD: hiremind
    volumes:
      - hiremind-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hiremind"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
    working_dir: /app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://hiremind:hiremind@postgres:5432/hiremind
    volumes:
      - ./backend:/app
    ports:
      - "8020:8000"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: ./backend
    working_dir: /app
    command: python -m app.worker
    env_file:
      - backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://hiremind:hiremind@postgres:5432/hiremind
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  hiremind-postgres:
